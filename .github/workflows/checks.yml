name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Windows PowerShell 5.1
        shell: powershell
        run: |
          ./tests/Hide-DotFolders.Tests.ps1
          ./tests/Safety.Tests.ps1
          ./tests/Task.Tests.ps1
          ./tests/Audit.Tests.ps1
      - name: PowerShell 7
        shell: pwsh
        run: |
          ./tests/Hide-DotFolders.Tests.ps1
          ./tests/Safety.Tests.ps1
          ./tests/Task.Tests.ps1
          ./tests/Audit.Tests.ps1
